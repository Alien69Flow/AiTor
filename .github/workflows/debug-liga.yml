name: debug-liga

# Temporal: diagnosticar por qué falla api/league.test.ts en el job build.
# Corre sólo esa suite y recorta la salida para que el log quepa entero.
# Se elimina en cuanto el fallo esté localizado.
on:
  push:
    branches: [feat/liga-verificable]

permissions:
  contents: read

jobs:
  liga:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sólo la liga
        run: npx vitest run api/league.test.ts --reporter=verbose 2>&1 | tail -n 120
