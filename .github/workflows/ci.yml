name: CI

# Un único gate, sin secretos y sin acciones de terceros: instala con el
# lockfile, pasa los tests, compila y, en un job aparte, dice dónde se fue el
# tiempo y enlaza el paso que falló con su línea del log.
#
# `npm ci` avisa en un segundo y con el motivo exacto si package.json y
# package-lock.json se separan (así se rompió main el 9 de noviembre). Los tests
# bloquean: estaban en verde al volverlos obligatorios. El lint sigue siendo
# informativo porque arrastra deuda previa en src, supabase/functions y backend,
# y eso no debe tapar un fallo real ni frenar una PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` y no `npm install`: si el lockfile no cuadra, falla aquí en un
      # segundo con el paquete que falta, en vez de colar un árbol distinto al
      # que se despliega.
      - name: Install dependencies
        run: npm ci

      # El reporter json deja un fichero con la duración de cada test para el
      # job `resumen`; la salida de siempre no cambia y los tests corren una vez.
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: vitest-report.json
          if-no-files-found: ignore
          retention-days: 7

  # Dónde se va el tiempo, de un vistazo: los pasos del job `build` con su
  # estado y su duración (los tiempos los da la API de Actions para este mismo
  # run, así que no hay nada que mantener a mano) y los tests más lentos desde
  # el informe JSON de Vitest. Sale siempre, también cuando `build` muere en
  # `npm ci`, y nunca cambia el estado del run: todo lo que puede fallar va
  # envuelto en `||`.
  resumen:
    name: resumen de tiempos
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    permissions:
      contents: read
      # Leer los pasos y la duración de este run.
      actions: read
    steps:
      - name: Traer el informe de Vitest
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vitest-report
          path: ${{ runner.temp }}/vitest

      - name: Resumen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBS_JSON: ${{ runner.temp }}/jobs.json
          INFORME_JSON: ${{ runner.temp }}/vitest/vitest-report.json
        run: |
          set -u
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > "$JOBS_JSON" 2>/dev/null || : > "$JOBS_JSON"
          {
            echo "## Dónde se va el tiempo"
            echo ""
            node -e '
              const fs = require("node:fs");
              const ruta = process.env.JOBS_JSON || "";
              let datos = {};
              try {
                datos = ruta && fs.existsSync(ruta) ? JSON.parse(fs.readFileSync(ruta, "utf8")) : {};
              } catch {
                datos = {};
              }
              const jobs = (datos.jobs || []).filter((job) => (job.name || "") !== "resumen de tiempos");
              if (!jobs.length) {
                console.log("_La API no devolvió los jobs del run; los tiempos están en la página del run._");
                process.exit(0);
              }
              const seg = (paso) => (new Date(paso.completed_at) - new Date(paso.started_at)) / 1000;
              const marca = (conclusion) => {
                if (conclusion === "success") return "ok";
                if (conclusion === "failure") return "**falló**";
                if (conclusion === "skipped") return "saltado";
                if (conclusion === "cancelled") return "cancelado";
                return conclusion || "—";
              };
              const roto = (conclusion) => conclusion === "failure" || conclusion === "cancelled";
              const enlace = (job, paso) =>
                job.html_url && paso.number ? job.html_url + "#step:" + paso.number + ":1" : "";
              const filas = [];
              for (const job of jobs) {
                for (const paso of job.steps || []) {
                  if (!paso.started_at || !paso.completed_at) continue;
                  const url = roto(paso.conclusion) ? enlace(job, paso) : "";
                  filas.push({
                    job: job.name,
                    texto: url ? "[" + paso.name + "](" + url + ")" : paso.name,
                    estado: marca(paso.conclusion),
                    segundos: seg(paso),
                  });
                }
              }
              const total = filas.reduce((suma, fila) => suma + fila.segundos, 0);
              const reloj = (dato) => {
                const redondo = Math.round(dato);
                return Math.floor(redondo / 60) + ":" + String(redondo % 60).padStart(2, "0");
              };
              console.log("| Job | Paso | Estado | Duración | Parte del tiempo medido |");
              console.log("| --- | --- | --- | ---: | ---: |");
              for (const fila of filas) {
                const parte = total > 0 ? Math.round((fila.segundos / total) * 100) : 0;
                console.log("| " + fila.job + " | " + fila.texto + " | " + fila.estado + " | " + reloj(fila.segundos) + " | " + parte + " % |");
              }
              const enCurso = jobs
                .filter((job) => (job.steps || []).some((paso) => paso.started_at && !paso.completed_at))
                .map((job) => job.name);
              console.log("");
              console.log("**Total medido:** " + reloj(total) + " en " + jobs.length + " job(s)" + (enCurso.length ? "; todavía en curso: " + enCurso.join(", ") : "") + ". Los pasos en rojo enlazan con su línea del log.");
            ' || echo "_No se pudo leer el informe de tiempos._"
            echo ""
            echo "## Tests más lentos"
            echo ""
            node -e '
              const fs = require("node:fs");
              const informe = process.env.INFORME_JSON || "";
              if (!informe || !fs.existsSync(informe)) {
                console.log("_Vitest no dejó informe: los tests no llegaron a ejecutarse._");
                process.exit(0);
              }
              let datos = {};
              try {
                datos = JSON.parse(fs.readFileSync(informe, "utf8"));
              } catch {
                datos = {};
              }
              const relativa = (ruta) => (ruta.startsWith(process.cwd() + "/") ? ruta.slice(process.cwd().length + 1) : ruta);
              const tests = [];
              for (const fichero of datos.testResults || []) {
                for (const test of fichero.assertionResults || []) {
                  tests.push({
                    nombre: test.fullName || test.title || "(sin nombre)",
                    fichero: relativa(fichero.name || ""),
                    milisegundos: Number(test.duration) || 0,
                  });
                }
              }
              tests.sort((a, b) => b.milisegundos - a.milisegundos);
              const lentos = tests.slice(0, 10);
              if (!lentos.length) {
                console.log("_El informe no trae tests con duración._");
                process.exit(0);
              }
              const barra = (texto) => texto.replace(/\|/g, "\\|");
              console.log("| Test | Fichero | Duración |");
              console.log("| --- | --- | ---: |");
              for (const test of lentos) {
                console.log("| " + barra(test.nombre) + " | " + barra(test.fichero) + " | " + (test.milisegundos / 1000).toFixed(2) + " s |");
              }
              console.log("");
              console.log("De " + tests.length + " tests, los 10 más lentos.");
            ' || echo "_No se pudo leer el informe de tests._"
          } | tee -a "$GITHUB_STEP_SUMMARY"
