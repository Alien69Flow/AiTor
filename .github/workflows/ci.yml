name: CI

# Instala, compila y prueba. Sin secretos, así que nunca falla por claves que
# falten. Tipos, build, tests y lint bloquean: un rojo de verdad tiene que verse
# en la CI, no quedarse dentro de un job que termina en verde.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` en vez de `npm install`: instala exactamente el árbol del
      # lockfile y falla si `package.json` no cuadra con él. Con `npm install`,
      # un lockfile desfasado se arreglaba en silencio y la CI medía otra cosa.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Vite compila sin comprobar tipos, así que un TS2339 podía llegar a `main`
      # con la CI en verde. `tsc --noEmit` va antes del build para fallar rápido y
      # con el error de tipos, no con el de empaquetado.
      - name: Typecheck
        run: npm run typecheck

      # `tsc -b` sólo compila los proyectos que referencia la raíz
      # (`tsconfig.app.json` y `tsconfig.node.json`). `tsconfig.api.json` existía
      # desde la fase 1 pero no lo ejecutaba ningún paso, así que los tipos de
      # `api/` y los de sus tests no los miraba ningún gate.
      - name: Typecheck de la API
        run: npx tsc -p tsconfig.api.json --noEmit

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
