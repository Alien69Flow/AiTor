name: CI

# Quality gate + dependency audit.
# Uses only first-party GitHub actions (actions/*) and no secrets, so it is safe
# on pull requests from forks. Merge control lives in the branch protection
# "required status checks" — this workflow does not auto-merge anything.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # lockfile is generated with npm 10 (Node 22); do not regenerate with npm 11.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # jsdom needs require(esm), so these only run on Node >= 20 (this job uses
      # 22). Vitest 3 is pinned: vitest 5 requires Vite 6 and this app is on 5.
      # El reporter json deja un fichero con la duración de cada test para el
      # resumen del job `resumen`; la salida de siempre no cambia y los tests
      # corren una sola vez.
      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # The repo carries pre-existing lint debt (135 problems: src, supabase/functions,
      # backend). Keep it non-blocking so this gate stays useful, and flip it to
      # blocking once that backlog is cleared. New/changed files must be clean.
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: warn
          retention-days: 7

      # El informe de Vitest viaja al job `resumen` como artefacto: son unos pocos
      # KB y los tests no se vuelven a ejecutar.
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: vitest-report.json
          if-no-files-found: ignore
          retention-days: 7

  # The login page offers every method GoTrue has switched on, so an enabled
  # provider without credentials is a button that dies on click (that is how
  # Google and Apple broke when the Lovable broker was retired). This probes the
  # real project exactly like the browser does — /settings and /authorize are
  # public, so no secret is involved — and fails only in that state, never for a
  # provider nobody turned on. `scripts/auth-providers.baseline.json` records the
  # accepted exceptions with an expiry date, so "later" cannot become "never".
  providers:
    name: auth providers gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`: the gate only uses node's fetch and the publishable key that
      # already ships inside the browser bundle.
      - name: Probe Supabase sign-in providers
        run: npm run auth:providers:gate

  audit:
    name: audit (critical only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails only on *critical* advisories: advisories without a patched release
      # are expected (see docs/dependency-audit.md) and would make this gate noise.
      - name: Fail on critical advisories
        shell: bash
        run: |
          set -o pipefail
          npm audit --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const m = a.metadata.vulnerabilities;
            console.log(`audit: total=${m.total} critical=${m.critical} high=${m.high} moderate=${m.moderate} low=${m.low}`);
            const critical = Object.entries(a.vulnerabilities).filter(([, v]) => v.severity === "critical");
            if (critical.length) {
              for (const [name, v] of critical) console.error(`CRITICAL: ${name} (${JSON.stringify(v.fixAvailable)})`);
              process.exit(1);
            }
          '

  # Dónde se va el tiempo, de un vistazo: los pasos de los tres jobs con su
  # duración (los tiempos los da la API de Actions para este mismo run, así que
  # no hay nada que mantener a mano) y los tests más lentos, sacados del informe
  # JSON de Vitest. Si el job de CI se va muy por encima de la media de los
  # últimos runs, avisa aquí y en la PR. Es un informe, no un gate: si algo falla
  # en este job lo dice el resumen y nadie se queda sin fusionar.
  resumen:
    name: resumen de tiempos
    runs-on: ubuntu-latest
    needs: [quality, audit, providers]
    if: always()
    permissions:
      contents: read
      # Leer los pasos y la lista de runs de este repositorio.
      actions: read
      # Sólo para el aviso de "este run va lento". En una PR desde un fork el
      # token llega de sólo lectura y el comentario no sale; el aviso queda
      # igualmente en el resumen del run.
      pull-requests: write
    steps:
      - name: Traer el informe de Vitest
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vitest-report
          path: ${{ runner.temp }}/vitest

      - name: Resumen de tiempos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOBS_JSON: ${{ runner.temp }}/jobs.json
          RUN_JSON: ${{ runner.temp }}/run.json
          RUNS_JSON: ${{ runner.temp }}/runs.json
          HISTORIAL_JSON: ${{ runner.temp }}/historial.json
          ANTERIORES: ${{ runner.temp }}/anteriores.txt
          AVISO_MD: ${{ runner.temp }}/aviso.md
          INFORME_JSON: ${{ runner.temp }}/vitest/vitest-report.json
          NUMERO_PR: ${{ github.event.pull_request.number }}
        run: |
          set -u
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > "$JOBS_JSON" 2>/dev/null || : > "$JOBS_JSON"
          {
            echo "## Dónde se va el tiempo"
            echo ""
            node -e '
              const fs = require("node:fs");
              const ruta = process.env.JOBS_JSON || "";
              let datos = {};
              try {
                datos = ruta && fs.existsSync(ruta) ? JSON.parse(fs.readFileSync(ruta, "utf8")) : {};
              } catch {
                datos = {};
              }
              const jobs = (datos.jobs || []).filter((job) => (job.name || "") !== "resumen de tiempos");
              if (!jobs.length) {
                console.log("_La API no devolvió los jobs del run; los tiempos están en la página del run._");
                process.exit(0);
              }
              const seg = (paso) => (new Date(paso.completed_at) - new Date(paso.started_at)) / 1000;
              const filas = [];
              for (const job of jobs) {
                for (const paso of job.steps || []) {
                  if (!paso.started_at || !paso.completed_at) continue;
                  filas.push({ job: job.name, nombre: paso.name, segundos: seg(paso) });
                }
              }
              const total = filas.reduce((suma, fila) => suma + fila.segundos, 0);
              const reloj = (dato) => {
                const redondo = Math.round(dato);
                return Math.floor(redondo / 60) + ":" + String(redondo % 60).padStart(2, "0");
              };
              console.log("| Job | Paso | Duración | Parte del tiempo medido |");
              console.log("| --- | --- | ---: | ---: |");
              for (const fila of filas) {
                const parte = total > 0 ? Math.round((fila.segundos / total) * 100) : 0;
                console.log("| " + fila.job + " | " + fila.nombre + " | " + reloj(fila.segundos) + " | " + parte + " % |");
              }
              const enCurso = jobs
                .filter((job) => (job.steps || []).some((paso) => paso.started_at && !paso.completed_at))
                .map((job) => job.name);
              console.log("");
              console.log("**Total medido:** " + reloj(total) + " en " + jobs.length + " jobs" + (enCurso.length ? "; todavía en curso: " + enCurso.join(", ") : "") + ". Los pasos de limpieza (post) terminan después de este resumen, así que no entran; el reloj del run completo está en su cabecera.");
            ' || echo "_No se pudo leer el informe de tiempos._"
            echo ""
            echo "## Tests más lentos"
            echo ""
            node -e '
              const fs = require("node:fs");
              const informe = process.env.INFORME_JSON || "";
              if (!informe || !fs.existsSync(informe)) {
                console.log("_Vitest no dejó informe: los tests no llegaron a ejecutarse._");
                process.exit(0);
              }
              let datos = {};
              try {
                datos = JSON.parse(fs.readFileSync(informe, "utf8"));
              } catch {
                datos = {};
              }
              const relativa = (ruta) => (ruta.startsWith(process.cwd() + "/") ? ruta.slice(process.cwd().length + 1) : ruta);
              const tests = [];
              for (const fichero of datos.testResults || []) {
                for (const test of fichero.assertionResults || []) {
                  tests.push({
                    nombre: test.fullName || test.title || "(sin nombre)",
                    fichero: relativa(fichero.name || ""),
                    milisegundos: Number(test.duration) || 0,
                  });
                }
              }
              tests.sort((a, b) => b.milisegundos - a.milisegundos);
              const lentos = tests.slice(0, 10);
              if (!lentos.length) {
                console.log("_El informe no trae tests con duración._");
                process.exit(0);
              }
              const barra = (texto) => texto.replace(/\|/g, "\\|");
              console.log("| Test | Fichero | Duración |");
              console.log("| --- | --- | ---: |");
              for (const test of lentos) {
                console.log("| " + barra(test.nombre) + " | " + barra(test.fichero) + " | " + (test.milisegundos / 1000).toFixed(2) + " s |");
              }
              console.log("");
              console.log("De " + tests.length + " tests, los 10 más lentos.");
            ' || echo "_No se pudo leer el informe de tests._"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # ¿Este run se ha ido de tiempo? Se compara el job de CI con la media de
          # los últimos runs del workflow. Nunca cambia el estado del job.
          : > "$HISTORIAL_JSON"
          : > "$ANTERIORES"
          : > "$AVISO_MD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUN_JSON" 2>/dev/null || : > "$RUN_JSON"
          WF_ID=$(node -e 'try { console.log(require(process.env.RUN_JSON).workflow_id) } catch { console.log("0") }' 2>/dev/null || echo 0)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_ID/runs?per_page=20" > "$RUNS_JSON" 2>/dev/null || : > "$RUNS_JSON"
          node -e '
            const fs = require("node:fs");
            let datos = {};
            try {
              datos = JSON.parse(fs.readFileSync(process.env.RUNS_JSON, "utf8"));
            } catch {
              datos = {};
            }
            const ids = [];
            for (const run of datos.workflow_runs || []) {
              if (!run.id || String(run.id) === process.env.GITHUB_RUN_ID) continue;
              ids.push(run.id);
              if (ids.length >= 5) break;
            }
            fs.writeFileSync(process.env.ANTERIORES, ids.join("\n"));
          ' 2>/dev/null || :
          while read -r ANTERIOR; do
            [ -n "$ANTERIOR" ] || continue
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANTERIOR/jobs?per_page=50" \
              --jq '[.jobs[] | select(.name | contains("typecheck")) | select(.started_at != null and .completed_at != null) | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))] | max // empty' \
              2>/dev/null >> "$HISTORIAL_JSON" || :
          done < "$ANTERIORES"
          node -e '
            const fs = require("node:fs");
            const leer = (ruta) => {
              try {
                return fs.readFileSync(ruta, "utf8");
              } catch {
                return "";
              }
            };
            const numeros = leer(process.env.HISTORIAL_JSON)
              .split("\n")
              .map((linea) => Number(linea.trim()))
              .filter((n) => Number.isFinite(n) && n > 0);
            let actual = 0;
            try {
              const datos = JSON.parse(leer(process.env.JOBS_JSON));
              const job = (datos.jobs || []).find((j) => (j.name || "").includes("typecheck"));
              if (job && job.started_at) actual = (Date.now() - new Date(job.started_at).getTime()) / 1000;
            } catch {
              actual = 0;
            }
            const reloj = (dato) => {
              const redondo = Math.round(dato);
              return Math.floor(redondo / 60) + ":" + String(redondo % 60).padStart(2, "0");
            };
            if (numeros.length < 3 || actual <= 0) {
              fs.writeFileSync(process.env.AVISO_MD, "");
              process.exit(0);
            }
            const media = numeros.reduce((suma, n) => suma + n, 0) / numeros.length;
            const sobra = actual - media;
            if (sobra < 60 || actual < media * 1.5) {
              fs.writeFileSync(process.env.AVISO_MD, "");
              process.exit(0);
            }
            const enlace = process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID;
            fs.writeFileSync(
              process.env.AVISO_MD,
              "## Este run va lento\n\n" +
                "El job de CI lleva **" + reloj(actual) + "** frente a **" + reloj(media) + "** de media en los últimos " + numeros.length + " runs, " + reloj(sobra) + " de más. Las tablas de arriba dicen dónde se fue el tiempo: [ver el run](" + enlace + ").\n",
            );
          ' 2>/dev/null || : > "$AVISO_MD"
          if [ -s "$AVISO_MD" ]; then
            cat "$AVISO_MD" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "${NUMERO_PR:-}" ]; then
              gh pr comment "$NUMERO_PR" --body-file "$AVISO_MD" 2>/dev/null \
                || echo "_No se pudo comentar en la PR: el aviso queda en el resumen del run._"
            fi
          fi
