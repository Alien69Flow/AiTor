name: CI

# Cuatro controles, tres de ellos nuevos como bloqueantes: tipos (tsc -b),
# compilación, tests y lint. Sin secretos, así que nunca falla por claves que
# falten.
#
# Antes sólo el build bloqueaba: los tests y el lint eran informativos, y no
# había typecheck. Como `vite build` usa SWC, que borra los tipos sin mirarlos,
# un error de tipos llegaba a `main` con todo en verde.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm install` en vez de `npm ci`: no falla si el lockfile quedó desfasado
      # tras editar package.json desde la web de GitHub.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # `npm run typecheck` = `tsc -b` sobre tsconfig.app.json (src) y
      # tsconfig.node.json (vite.config.ts). Va antes del build a propósito: el
      # build no comprueba tipos, así que este es el único paso que los mira.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
