name: CI

# Instala, compila y prueba. Sin secretos, así que nunca falla por claves que
# falten. Build, tests y lint bloquean: un rojo de verdad tiene que verse en la
# CI, no quedarse dentro de un job que termina en verde.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm install` en vez de `npm ci`: no falla si el lockfile quedó desfasado
      # tras editar package.json desde la web de GitHub.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
