name: CI

# Instala, compila y prueba. Sin secretos, así que nunca falla por claves que
# falten. Tipos, build, tests y lint bloquean: un rojo de verdad tiene que verse
# en la CI, no quedarse dentro de un job que termina en verde.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` en vez de `npm install`: instala exactamente el árbol del
      # lockfile y falla si `package.json` no cuadra con él. Con `npm install`,
      # un lockfile desfasado se arreglaba en silencio y la CI medía otra cosa.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Vite compila sin comprobar tipos, así que un TS2339 podía llegar a `main`
      # con la CI en verde. `tsc --noEmit` va antes del build para fallar rápido y
      # con el error de tipos, no con el de empaquetado.
      - name: Typecheck
        run: npm run typecheck

      # `tsc -b` sólo mira `src/` (tsconfig.app.json y tsconfig.node.json). Los
      # handlers de `api/` tienen su propio tsconfig, con `strict` y `types: node`,
      # y hasta ahora ningún paso los compilaba: un error de tipos ahí sólo se
      # veía al desplegar. Va también antes del build, por el mismo motivo.
      - name: Typecheck API
        run: npm run typecheck:api

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
