# Aplica el cableado de transporte del globo y lo confirma en la rama.
#
# El parche está escrito y probado, pero no se puede ejecutar desde el portátil
# del autor en cada cambio: esto lo hace la CI sobre el fichero real, y sólo
# cuando cambia algo que el parche lee o toca. Si las anclas cambiaron, el
# script falla con código 1 y no escribe nada.

name: Cableado de transporte

on:
  workflow_dispatch:
  push:
    branches: [feat/transporte-modelos]
    paths:
      - "src/components/globe/CesiumGlobe.tsx"
      - "src/lib/transport-wiring-patch.ts"
      - "scripts/apply-transport-wiring.ts"
      - ".github/workflows/apply-transport-wiring.yml"

permissions:
  contents: write

concurrency:
  group: cableado-transporte
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` para no lanzar prebuild/predev, que aquí no hacen falta.
      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar el cableado
        run: npx tsx scripts/apply-transport-wiring.ts

      - name: Confirmar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios: el cableado ya estaba aplicado."
            exit 0
          fi
          git add -A
          git commit -m "Globo: escala adaptativa de los modelos y vuelos/barcos sin agrupar"
          git push
