# Deja el rail de controles y la leyenda plegados al cargar el globo.
#
# El parche vive en `src/lib/globe-fold-patch.ts` con sus pruebas y aquí se
# aplica sobre `GlobeDashboard.tsx`, que es el fichero real. Si el panel cambió
# y las anclas no están, el script sale con 1 y no escribe nada.
#
# El job verifica antes de confirmar (typecheck del proyecto y las pruebas del
# parche) porque el commit que empuja el bot se hace con GITHUB_TOKEN y GitHub
# no lanza workflows con ese token: sin estos pasos, el head con el plegado
# aplicado no lo compilaría nadie.
#
# La confirmación rebasa con reintentos: puede entrar un commit mientras corre.

name: Globo plegado

on:
  workflow_dispatch:
  push:
    branches: [feat/globo-plegado]
    paths:
      - "src/components/dashboard/GlobeDashboard.tsx"
      - "src/lib/globe-fold-patch.ts"
      - "scripts/apply-globe-fold-patch.ts"
      - ".github/workflows/apply-globe-fold.yml"

permissions:
  contents: write

concurrency:
  group: globo-plegado
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar el plegado
        run: npx tsx scripts/apply-globe-fold-patch.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas del parche
        run: npx vitest run src/lib/globe-fold-patch.test.ts

      - name: Confirmar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios: el globo ya nace plegado."
            exit 0
          fi
          git add -A
          git commit -m "Globo: rail y leyenda plegados al cargar"
          for intento in 1 2 3 4 5; do
            if git push origin HEAD:feat/globo-plegado; then
              echo "Plegado confirmado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado (intento $intento): rebaso sobre origin y reintento."
            if ! git pull --rebase --autostash origin feat/globo-plegado; then
              git rebase --abort || true
              echo "El rebase no se pudo aplicar: revisa el conflicto a mano." >&2
              exit 1
            fi
          done
          echo "No se pudo confirmar el plegado tras cinco intentos." >&2
          exit 1
