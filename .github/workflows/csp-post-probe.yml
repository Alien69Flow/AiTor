name: csp-post-probe

# Sonda temporal: ejecuta el handler real con los dos formatos de cuerpo y
# publica el código y la línea de log. Se borra en el commit siguiente.

on:
  push:
    paths:
      - ".github/workflows/csp-post-probe.yml"
      - "api/csp-report.probe.test.ts"
      - "api/csp-report.ts"

permissions:
  contents: read

jobs:
  probe:
    name: csp-post
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: POST a los dos formatos
        run: |
          set +e
          npx vitest run api/csp-report.probe.test.ts > probe.log 2>&1
          status=$?
          grep -E "\[probe\]|Test Files|Tests  |FAIL" probe.log
          exit $status
