name: PR Reviewer
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip3 install agentic-pr-reviewer
      - run: agentic-pr-reviewer --diff "$(git diff origin/main...HEAD)"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
