name: ip patch

# Sonda temporal, se borra en un commit posterior: cambia el bloque de IP de
# api/mcp.ts por la funcion compartida y no commitea hasta que compila, pasa
# las pruebas y pasa eslint.

# relanzada tras corregir header() y el espacio irregular.

on:
  push:
    branches: ["chore/ip-unificado"]
    paths:
      - ".github/workflows/ip-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: parchear y verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ip-unificado

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Dependencias
        run: npm ci --no-audit --no-fund >/dev/null 2>&1

      - name: Parchear mcp
        run: |
          node <<'JS'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "api/mcp.ts";
          let src = readFileSync(path, "utf8");

          const block = [
            '  const forwarded = req.headers["x-forwarded-for"];',
            '  const ip = (Array.isArray(forwarded) ? forwarded[0] : forwarded)?.split(",")[0].trim() ||',
            '    req.socket?.remoteAddress ||',
            '    "unknown";',
          ].join("\n");

          if (!src.includes(block)) {
            console.error("falta el bloque de IP de mcp.ts");
            process.exit(1);
          }
          src = src.replace(
            block,
            "  // Regla unica de IP: vive en api/_shared/types.ts, la misma que usa el lado Deno.\n  const ip = clientIp(req);",
          );

          const importAnchor = 'import type { VercelRequest, VercelResponse } from "@vercel/node";';
          if (!src.includes(importAnchor)) {
            console.error("falta el import de tipos de Vercel");
            process.exit(1);
          }
          src = src.replace(importAnchor, importAnchor + '\nimport { clientIp } from "./_shared/types.js";');

          const commentAnchor = " * **Este archivo no importa nada del proyecto a propósito.** La primera versión";
          if (!src.includes(commentAnchor)) {
            console.error("falta el comentario de cabecera");
            process.exit(1);
          }
          src = src.replace(
            commentAnchor,
            " * **Este archivo no importa nada de `src/` a propósito.** La única excepción es\n" +
              " * `api/_shared/types.js` (la regla de IP), el mismo import relativo que ya usan\n" +
              " * los demás handlers de `api/` y que no arrastra nada del navegador.\n" +
              " *\n" +
              " * La primera versión",
          );

          writeFileSync(path, src);
          console.log("parcheado api/mcp.ts");
          JS

      - name: Typecheck de la API
        run: |
          npx tsc -p tsconfig.api.json --noEmit && echo TSC_API_OK
          printf '{"extends":"./tsconfig.api.json","include":["api/mcp.ts","api/_shared/types.ts"]}' > tsconfig.mcp.check.json
          npx tsc -p tsconfig.mcp.check.json --noEmit && echo TSC_MCP_OK

      - name: Pruebas de la regla
        run: |
          npx vitest run api/_shared/types.test.ts supabase/functions/_shared/guard.ip.test.ts supabase/functions/_shared/guard.test.ts 2>&1 | tail -20

      - name: Lint
        run: |
          npx eslint api/mcp.ts api/_shared/types.ts api/_shared/types.test.ts supabase/functions/_shared/guard.ts supabase/functions/_shared/guard.ip.test.ts && echo LINT_OK

      - name: Commit del parche
        run: |
          if git diff --quiet; then
            echo "sin cambios que commitear"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/mcp.ts
          git commit -m "fix(seguridad): api/mcp.ts usa la regla unica de IP"
          git push origin HEAD:chore/ip-unificado
