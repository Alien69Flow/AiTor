name: aplicar-parche-alertas

# Efímero: aplica al webhook los cambios de `/alerta` y se autoverifica por blob.
# Vive en la rama mientras dura el cambio y se borra en el commit siguiente.
on:
  push:
    branches: [feat/alertas-datos]
    paths:
      - .github/workflows/alertas-webhook-patch.yml
      - scripts/apply-alertas-webhook.mjs

permissions:
  contents: write

concurrency: aplicar-parche-alertas

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alertas-datos
          fetch-depth: 0
      - name: Identidad del commit
        run: |
          git config user.name "AiTor CI"
          git config user.email "ci@aitor.alienflow.space"
      - name: Aplicar y verificar
        run: node scripts/apply-alertas-webhook.mjs
