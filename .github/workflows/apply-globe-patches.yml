# Aplica los parches del globo y los deja verificados en una rama.
#
# Antes este workflow empujaba el parche directamente a `main` y no podía:
# `main` está protegida y exige el check «typecheck · lint · build», así que el
# push se rechaza con GH006 «protected branch hook declined». Y aunque no
# estuviera protegida el commit lo firma `GITHUB_TOKEN`, con el que GitHub no
# lanza workflows: el fuente parcheado no tendría ni CI ni despliegue, y el
# globo seguiría sirviéndose desde el commit sin parchear.
#
# Ahora el resultado se publica en `parches/globo-auto` y entra por el camino
# normal: PR, CI verde y fusión. Aquí se compila antes de empujar, así que la
# rama que sale ya está verificada y no depende de que alguien recuerde
# lanzarlo a mano.
#
# Los scripts siguen saliendo con código 1 y sin escribir nada si las anclas
# cambiaron: un fallo aquí es un aviso, no un parche a medias.

name: Parches del globo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/components/globe/CesiumGlobe.tsx"
      - "src/lib/globe-layers.ts"
      - "src/lib/globe-base-patch.ts"
      - "src/lib/globe-defaults-patch.ts"
      - "scripts/apply-globe-base-patch.ts"
      - "scripts/apply-globe-defaults-patch.ts"
      - ".github/workflows/apply-globe-patches.yml"
  # Repaso semanal por si una capa nueva del catálogo necesita el parche.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: parches-globo
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` para no lanzar prebuild/predev, que aquí no hacen falta.
      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Parche de la base del globo
        run: npx tsx scripts/apply-globe-base-patch.ts

      # El parche de capas por defecto vive en su propio script; si aún no está,
      # se dice y se sigue, en vez de fallar por un archivo que no existe.
      - name: Parche de capas por defecto
        run: |
          if [ -f scripts/apply-globe-defaults-patch.ts ]; then
            npx tsx scripts/apply-globe-defaults-patch.ts
          else
            echo "· Todavía no existe scripts/apply-globe-defaults-patch.ts."
          fi

      # Se compila lo que se va a publicar. Sin esto la rama saldría sin
      # verificar y el PR empezaría en rojo por un parche mal anclado.
      - name: Typecheck del árbol parcheado
        run: npm run typecheck

      - name: Publicar la rama si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios: los parches ya están aplicados."
            exit 0
          fi

          git checkout -B parches/globo-auto
          git add -A
          git commit -m "Globo: parches automáticos de base y capas por defecto"

          for intento in 1 2 3 4 5; do
            if git push --force-with-lease origin parches/globo-auto; then
              echo "Rama publicada en el intento $intento."
              echo "Abre el PR parches/globo-auto -> main para que el CI lo verifique."
              exit 0
            fi
            echo "Push rechazado (intento $intento): se refresca la ref y se reintenta."
            git fetch origin parches/globo-auto || true
            git rebase --autostash origin/parches/globo-auto || true
          done

          echo "No se pudo publicar la rama tras cinco intentos." >&2
          exit 1
