name: reconstruir-paquete

# Temporal: aplica el parche revisado desde .github/pq.patch, comprueba que los
# ficheros resultantes son byte a byte los probados en local (por su hash de git)
# y borra los ficheros de acarreo en el mismo commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Aplicar, verificar y confirmar
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn .github/pq.patch

          printf '%s\n' \
            "05ccd8e38dced25967131cbbdf7a7b1bc659b62a src/lib/chat-prefs.ts" \
            "7fb110595e10c3e64aefae6b9ce307e37f540064 src/lib/neural-core-model.ts" \
            > /tmp/manifiesto

          while read -r esperado ruta; do
            actual=$(git hash-object "$ruta")
            if [ "$actual" != "$esperado" ]; then
              echo "hash no coincide en $ruta: $actual != $esperado"
              exit 1
            fi
            echo "ok $ruta $actual"
          done < /tmp/manifiesto

          git config user.name "Aitor CI"
          git config user.email "ci@alienflow.space"
          git rm --quiet .github/pq.patch .github/workflows/reconstruir-paquete.yml
          git commit \
            -m "fix(types): los dos TS2339 en los sitios que aun leian available" \
            -m "El catalogo quito available a proposito; chat-prefs y neural-core-model seguian leyendolo. Se cruzan con routable !== false, igual que ai-health, y el comentario de ACTIVE_ORACLES deja de prometer que estan vivos."
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
