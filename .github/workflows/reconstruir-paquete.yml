name: reconstruir-paquete

# Temporal: aplica el parche de package-lock.json desde .github/aitor-parche.patch,
# comprueba que el resultado es byte a byte el revisado (por su hash de git) y
# borra el parche. El cambio de ci.yml va ya en la rama porque el token del
# workflow no puede modificar ficheros de .github/workflows.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Aplicar, verificar y confirmar
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn .github/aitor-parche.patch

          esperado=31b66f27f624bcf652a1549257ea4fe5eddf86ec
          actual=$(git hash-object package-lock.json)
          if [ "$actual" != "$esperado" ]; then
            echo "hash no coincide en package-lock.json: $actual != $esperado"
            exit 1
          fi
          echo "ok package-lock.json $actual"

          git config user.name "Aitor CI"
          git config user.email "ci@alienflow.space"
          git rm --quiet .github/aitor-parche.patch
          git commit \
            -m "fix(ci): completa el lockfile con los dos plugins que faltaban" \
            -m "Faltaban en el lock los dos plugins @lovable.dev que package.json declara; se anaden sus entradas exactas (1.3.3 y 1.8.3, ya las que habia instaladas) sin tocar ninguna otra version."
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
