name: reconstruir-paquete

on:
  push:
    paths:
      - ".aitor-verificacion/**"

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "¿Llegó el paquete completo?"
        id: check
        run: |
          if [ -f .aitor-verificacion/part-04 ]; then
            echo ok=1 >> "$GITHUB_OUTPUT"
          else
            echo ok=0 >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruir y comprobar
        if: steps.check.outputs.ok == '1'
        run: |
          set -euo pipefail
          cat .aitor-verificacion/part-* | base64 -d | xz -dc | tar xf - -C .
          git apply --verbose webhook.patch
          rm -f webhook.patch
          cat > /tmp/esperado.txt <<'EOF'
          f08be7ec4229d1301f927a36f40057a346639de0 api/telegram-webhook.ts
          de8cff7962a9098aefec5aa65c7f0f520575eb2c api/telegram-webhook.probe.test.ts
          b2ec57c08e635f50952c40a01b750f1108eaa198 scripts/verify-production.mjs
          0c7f74c26baae519deb7dc415798fee0adbe1439 scripts/verify-production.test.mjs
          adfa0bd238f689f4a832ddac88a2e1630405c25d ROADMAP.md
          EOF
          fallo=0
          while read -r sha ruta; do
            real=$(git hash-object "$ruta")
            echo "$ruta $real"
            if [ "$real" != "$sha" ]; then echo "MISMATCH en $ruta"; fallo=1; fi
          done < /tmp/esperado.txt
          exit $fallo

      - name: Commit y push
        if: steps.check.outputs.ok == '1'
        run: |
          set -euo pipefail
          rm -rf .aitor-verificacion .github/workflows/reconstruir-paquete.yml
          git config user.name "aitor-bot"
          git config user.email "bot@alienflow.space"
          git add -A
          git commit -m "feat(verify): sonda de conocimiento y tabla de estado en verify:prod"
          git push origin HEAD:feat/verify-prod-conocimiento
