name: reconstruir-paquete

# Temporal: aplica el parche del cambio desde .github/aitor-parche.patch,
# comprueba que los ficheros resultantes son byte a byte los revisados (por su
# hash de git) y borra los dos ficheros de acarreo en el mismo commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Aplicar, verificar y confirmar
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn .github/aitor-parche.patch

          printf '%s\n' \
            "197a562dbdfc9b372d7ffb2ed88cbae259a8299d api/telegram-webhook.ts" \
            "aca6c4d8d1f0ecdb987dab7862dbce0a27d90b7a api/telegram-webhook.probe.test.ts" \
            > /tmp/manifiesto

          while read -r esperado ruta; do
            actual=$(git hash-object "$ruta")
            if [ "$actual" != "$esperado" ]; then
              echo "hash no coincide en $ruta: $actual != $esperado"
              exit 1
            fi
            echo "ok $ruta $actual"
          done < /tmp/manifiesto

          git config user.name "Aitor CI"
          git config user.email "ci@alienflow.space"
          git rm --quiet .github/aitor-parche.patch .github/workflows/reconstruir-paquete.yml
          git commit \
            -m "feat(telegram): el informe GET dice si Redis y el dedupe estan activos" \
            -m "Sin Redis claimUpdate deja pasar los reintentos de Telegram a proposito, asi que el diagnostico no podia distinguir un bot deduplicado de uno expuesto a turnos duplicados. Se informan solo booleanos: ni URL ni token."
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
