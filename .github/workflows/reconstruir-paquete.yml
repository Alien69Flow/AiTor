name: reconstruir-paquete

on:
  push:
    paths:
      - ".aitor-verificacion/**"

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "¿Llegó el paquete completo?"
        id: check
        run: |
          if [ -f .aitor-verificacion/part-06 ]; then
            echo ok=1 >> "$GITHUB_OUTPUT"
          else
            echo ok=0 >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruir y comprobar
        if: steps.check.outputs.ok == '1'
        run: |
          set -euo pipefail
          cat .aitor-verificacion/part-* | base64 -d | xz -dc | tar xf - -C .
          cat > /tmp/esperado.txt <<'EOF'
          cc314169224540d190d1ebabc07aa7c4734fdcf9 api/telegram-webhook.ts
          9bebe6c73cb8b9e3112dde167eac8fe3f40ac633 api/telegram-webhook.failure.test.ts
          15516d315c7ea60dfbb04e230e119a3a6c9711c3 api/telegram-knowledge.test.ts
          0fc4de6eca45e877b295339b963b816fc8e00bbd api/telegram-thread.test.ts
          b4ab9416fd5bfcedd8b0ed5bd0165f75e5b8e9c4 tests/api/telegram-webhook.test.ts
          70fcf03790105cae0479aa62872cf05cf921902f tests/api/telegram-retry.test.ts
          20047d91170e0455ed20dbed6331c77b6d425d6c tests/api/telegram-alerts.test.ts
          EOF
          fallo=0
          while read -r sha ruta; do
            real=$(git hash-object "$ruta")
            echo "$ruta $real"
            if [ "$real" != "$sha" ]; then echo "MISMATCH en $ruta"; fallo=1; fi
          done < /tmp/esperado.txt
          exit $fallo

      - name: Commit y push
        if: steps.check.outputs.ok == '1'
        run: |
          set -euo pipefail
          rm -rf .aitor-verificacion .github/workflows/reconstruir-paquete.yml
          git config user.name "aitor-bot"
          git config user.email "bot@alienflow.space"
          git add -A
          git commit -m "fix(telegram): rechazar entregas sin token válido"
          git push origin HEAD:fix/webhook-cerrado
