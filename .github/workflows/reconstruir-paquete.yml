name: reconstruir-paquete

# Temporal: aplica el parche revisado desde .github/pq.patch, comprueba que los
# ficheros resultantes son byte a byte los probados en local y borra el acarreo.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Aplicar, verificar y confirmar
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn .github/pq.patch

          printf '%s\n' \
            "6a65c7ea7f008970662e8ca8f537b3053c73c4ef api/telegram-webhook.ts" \
            "a45d147a4da2dfac668da05b36a81499e7202092 api/telegram-knowledge.coverage.test.ts" \
            > /tmp/manifiesto

          while read -r esperado ruta; do
            actual=$(git hash-object "$ruta")
            if [ "$actual" != "$esperado" ]; then
              echo "hash no coincide en $ruta: $actual != $esperado"
              exit 1
            fi
            echo "ok $ruta $actual"
          done < /tmp/manifiesto

          git config user.name "Aitor CI"
          git config user.email "ci@alienflow.space"
          git rm --quiet .github/pq.patch .github/workflows/reconstruir-paquete.yml
          git commit \
            -m "test(conocimiento): la sonda no puede perder cobertura sin que falle algo" \
            -m "Un bloque nuevo sin su pregunta dejaba la sonda igual de verde midiendo menos. El test cruza KNOWLEDGE_BLOCKS con KNOWLEDGE_SAMPLES y comprueba sin red que la pregunta de control sigue fuera del dominio."
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
