name: reconstruir-paquete

on:
  push:
    paths:
      - ".aitor-verificacion/**"

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir y comprobar
        run: |
          set -euo pipefail
          cat .aitor-verificacion/part-* | base64 -d | xz -dc | tar xf - -C .
          cat > /tmp/esperado.txt <<'EOF'
          fd0adf0b58dc297833a385115256b986bf0a8b3e vitest.setup.ts
          5bf732f0494d1c5dece6d902245151f2e82db0ff src/lib/arcade-best.test.ts
          abdcc657247daa446528c0a65dbed3bf46f20ad7 src/components/dashboard/UFOMonitorTab.revive.test.tsx
          EOF
          fallo=0
          while read -r sha ruta; do
            real=$(git hash-object "$ruta")
            echo "$ruta $real"
            if [ "$real" != "$sha" ]; then echo "MISMATCH en $ruta"; fallo=1; fi
          done < /tmp/esperado.txt
          exit $fallo

      - name: Commit y push
        run: |
          set -euo pipefail
          rm -rf .aitor-verificacion .github/workflows/reconstruir-paquete.yml
          git config user.name "aitor-bot"
          git config user.email "bot@alienflow.space"
          git add -A
          git commit -m "fix(tests): almacén propio en los tests que dependen de localStorage"
          git push origin HEAD:fix/tests-hermeticos-storage
