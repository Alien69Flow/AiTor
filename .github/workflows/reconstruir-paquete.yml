name: reconstruir-paquete

# Temporal: aplica el parche revisado desde .github/pq.patch, comprueba que los
# ficheros resultantes son byte a byte los probados en local (por su hash de
# git) y borra los ficheros de acarreo en el mismo commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Aplicar, verificar y confirmar
        shell: bash
        run: |
          set -euo pipefail
          git apply --index --whitespace=nowarn .github/pq.patch

          printf '%s\n' \
            "dd273470aab2dfa6f2ec2db064dacb68cd8a85c2 AGENTS.md" \
            "2e343ef653f0cb999b3db36648e25aa8c54a047e ROADMAP.md" \
            "0460f1ed5f8056cee151834383d9c81d14a26362 api/telegram-webhook.ts" \
            "7216a9604ab557ff12d1678a9785b04284fc8b82 api/telegram-webhook.probe.test.ts" \
            "be1b9e9e8165f6af8b035e44ea64d639e125b683 scripts/verify-production.mjs" \
            "67f067cb5f151a0a55ae499c4dc9ab44c872ccd6 scripts/verify-production.test.mjs" \
            > /tmp/manifiesto

          while read -r esperado ruta; do
            actual=$(git hash-object "$ruta")
            if [ "$actual" != "$esperado" ]; then
              echo "hash no coincide en $ruta: $actual != $esperado"
              exit 1
            fi
            echo "ok $ruta $actual"
          done < /tmp/manifiesto

          git config user.name "Aitor CI"
          git config user.email "ci@alienflow.space"
          git rm --quiet .github/pq.patch .github/pq-0 .github/pq-parte-0 \
            .github/aitor-parche.patch.xz.b64 .github/workflows/reconstruir-paquete.yml
          git commit \
            -m "docs(roadmap): un solo significado para cada estado y sonda real en la fase 4" \
            -m "La fase 4 decia que la pregunta de fuera de dominio se comprobaba a mano. Ahora la sonda remota lanza tambien una pregunta de control: si recupera un bloque, verify:prod falla; si el despliegue no la trae, queda sin verificar. El ROADMAP define una sola vez que significa cada estado y publica el estado de cada fase a partir de la ultima pasada."
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
