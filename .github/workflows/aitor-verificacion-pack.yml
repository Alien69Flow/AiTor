name: aitor-verificacion-pack

on:
  push:
    branches: [chore/verificar-produccion-roadmap]
    paths:
      - '.aitor-verificacion/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir los ficheros
        run: cat .aitor-verificacion/part-* | base64 -d | tar xzf - -C .
      - name: Comprobar que son los locales
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/verify-production.mjs)" = "7a606cde99bd2b27b23776cae0eca740c79cb17b"
          test "$(git hash-object scripts/verify-production.test.mjs)" = "f06abe5880702893bf45c6a91c7795579dac9bd3"
          test "$(git hash-object ROADMAP.md)" = "82a106f9867938b8c903780a0bd1d5b3d5f6736b"
          test "$(git hash-object package.json)" = "c3498c2874ac39abf92d81ccd46398ec615a49fc"
      - name: Commit
        run: |
          git config user.name "aitor-bot"
          git config user.email "aitor-bot@users.noreply.github.com"
          git add scripts/verify-production.mjs scripts/verify-production.test.mjs ROADMAP.md package.json
          git commit -m "chore(verificacion): sonda de produccion y roadmap comprobable"
          git push
