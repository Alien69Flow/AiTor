name: aitor-verificacion-pack

on:
  push:
    branches: [fix/guardia-rutas]
    paths:
      - '.aitor-verificacion/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruir los ficheros
        run: cat .aitor-verificacion/part-* | base64 -d | xz -dc | tar xf - -C .
      - name: Comprobar que son los locales
        run: |
          set -euo pipefail
          test "$(git hash-object tests/api/edge-functions.test.ts)" = "68e8d656dd3830a2ebb1c1bdac57041913ca81c9"
      - name: Commit
        run: |
          git config user.name "aitor-bot"
          git config user.email "aitor-bot@users.noreply.github.com"
          git add tests/api/edge-functions.test.ts
          git commit -m "test(api): guardia del contrato de despliegue de las rutas"
          git push
