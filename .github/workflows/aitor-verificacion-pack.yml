name: aitor-verificacion-pack

on:
  push:
    branches: [fix/hybrid-knowledge]
    paths:
      - '.aitor-verificacion/**'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruir los ficheros
        run: cat .aitor-verificacion/part-* | base64 -d | xz -dc | tar xf - -C .
      - name: Comprobar que son los locales
        run: |
          set -euo pipefail
          test "$(git hash-object api/_shared/knowledge.ts)" = "58ce74fcc8719f3ccde2425279676c976d3848d5"
          test "$(git hash-object tests/api/knowledge.test.ts)" = "3962eda1d087cf2166f79f98a4444b75066db33d"
      - name: Commit
        run: |
          git config user.name "aitor-bot"
          git config user.email "aitor-bot@users.noreply.github.com"
          git add api/_shared/knowledge.ts tests/api/knowledge.test.ts
          git commit -m "feat(conocimiento): indice BM25 con sinonimos y palabras clave"
          git push
