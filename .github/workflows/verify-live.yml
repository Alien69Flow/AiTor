name: Verify live cameras

# Las cámaras en directo son la parte de la app que más rota: una estacional
# (osos, pingüinos, otoño, nieve) deja de emitir sin que nadie toque el código y
# el visitante se come un reproductor roto. Este job las reverifica cada lunes y
# deja el resultado en `src/lib/live-status.generated.ts`, que la pestaña Alien
# usa para marcarlas «sin emisión».
#
# El script aborta con código 2 si más del 60 % de las sondas no se pueden
# completar (fallo de red del runner) y entonces no se escribe ni se commitea
# nada: mejor un estado viejo que sesenta cámaras marcadas como muertas.

on:
  schedule:
    # Lunes 06:00 UTC, antes de la jornada europea.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-live
  cancel-in-progress: false

jobs:
  verify:
    name: probe cameras · commit status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Probe every camera
        run: npm run verify:live

      - name: Commit the refreshed status
        shell: bash
        run: |
          set -euo pipefail
          status_file=src/lib/live-status.generated.ts
          if git diff --quiet -- "$status_file"; then
            echo "Sin cambios en $status_file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$status_file"
          git commit -m "chore(live): reverifica las cámaras en directo"
          git push
