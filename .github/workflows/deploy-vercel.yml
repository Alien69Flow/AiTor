name: deploy-vercel

# Despliegue a producción del sitio, sin depender de la integración de Git de
# Vercel, que lleva fallando en cada push a `main` («Deployment has failed») y
# deja producción con la build vieja.
#
# El build corre aquí, en el runner, así que si falla el error real queda en el
# log del job en vez de en un panel que hay que abrir a mano.
#
# Sólo hace falta un secreto: VERCEL_TOKEN (Vercel -> Account Settings ->
# Tokens). El proyecto y el equipo van escritos abajo porque no son secretos.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: false

env:
  VERCEL_PROJECT: ai-tor
  VERCEL_SCOPE: alien-flow-space
  PRODUCTION_URL: https://aitor.alienflow.space

jobs:
  deploy:
    name: build y despliegue a producción
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preflight de secretos
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta el secreto VERCEL_TOKEN (Vercel -> Account Settings -> Tokens). Sin el no hay despliegue desde GitHub."
            exit 1
          fi

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Enlazar el proyecto
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx --yes vercel@latest link --yes
          --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Bajar variables y ajustes de producción
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Construir
        run: npx --yes vercel@latest build --prod

      - name: Publicar
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado en $url"

      - name: Comprobar producción
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$PRODUCTION_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "Produccion responde 200"
              exit 0
            fi
            echo "Intento $i: HTTP $code"
            sleep 10
          done
          echo "::error::Produccion no respondio 200 tras el despliegue"
          exit 1

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Despliegue a produccion"
            echo ""
            echo "- URL publicada: ${{ steps.deploy.outputs.url }}"
            echo "- Produccion: $PRODUCTION_URL"
            echo "- Build: vercel build en Actions (log en este job)"
          } >> "$GITHUB_STEP_SUMMARY"
