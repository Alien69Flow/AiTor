name: ip tildes

# Un comentario nuevo sin tilde en `api/mcp.ts` (95 KB) y una concordancia
# rota en `supabase/functions/_shared/guard.ts`. Sin checkout local no se puede
# escribir medio fichero por la API, así que el cambio lo hace este workflow:
# parchea, comprueba que no queda texto sin tilde y se borra a sí mismo en el
# mismo commit. Es el mecanismo con el que se aplicó la regla de IP en esta
# rama.

on:
  push:
    branches: ["chore/ip-unificado"]
    paths:
      - ".github/workflows/ip-tildes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tildes:
    name: tildes y concordancia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ip-unificado

      - name: Corregir los dos comentarios
        run: |
          node <<'JS'
          const { readFileSync, writeFileSync } = require("node:fs");

          const cambios = [
            [
              "api/mcp.ts",
              "  // Regla unica de IP: vive en api/_shared/types.ts, la misma que usa el lado Deno.",
              "  // Regla única de IP: vive en api/_shared/types.ts, la misma que usa el lado Deno.",
            ],
            [
              "supabase/functions/_shared/guard.ts",
              "// esquivables: la manda el cliente y rotarla daba un cubo de rate limit nuevo",
              "// esquivable: la manda el cliente y rotarla daba un cubo de rate limit nuevo",
            ],
          ];

          for (const [path, antes, despues] of cambios) {
            const src = readFileSync(path, "utf8");
            if (src.includes(despues)) {
              console.log(`${path}: ya corregido`);
              continue;
            }
            if (!src.includes(antes)) {
              console.error(`${path}: no encuentro el texto esperado`);
              process.exit(1);
            }
            writeFileSync(path, src.replace(antes, despues));
            console.log(`${path}: corregido`);
          }
          JS

      - name: Que no quede texto sin tilde
        run: |
          if grep -n 'Regla unica' api/mcp.ts; then echo "queda unica"; exit 1; fi
          if grep -n '// esquivables:' supabase/functions/_shared/guard.ts; then echo "queda esquivables"; exit 1; fi
          echo LIMPIO_OK

      - name: Commit del arreglo y borrar la sonda
        run: |
          rm .github/workflows/ip-tildes.yml
          if git diff --quiet; then echo "sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ip): tildes y concordancia en los comentarios nuevos de la regla"
          git push origin HEAD:chore/ip-unificado
