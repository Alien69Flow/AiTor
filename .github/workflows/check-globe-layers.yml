# Audita las capas raster del globo contra sus servidores reales.
#
# `scripts/check-globe-layers.mjs` ya existía, pero sólo se ejecutaba a mano: por
# eso la leyenda pudo anunciar durante semanas capas que devolvían 404/500 sin
# que nadie se enterara. Aquí pasa a ser un job que se puede lanzar a demanda y
# que corre solo cada lunes, para que una capa rota se vea en Actions y no en la
# pantalla del visitante.
#
# No necesita claves: sondea GIBS (NASA) y el proxy de OpenWeather que ya vive
# en el proyecto de Supabase que sirve los datos del globo.

name: auditoria-capas-globo

on:
  workflow_dispatch:
  schedule:
    # Lunes a las 06:00 UTC: después del fin de semana, antes de la semana.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: auditoria-capas-globo
  cancel-in-progress: true

jobs:
  capas:
    name: capas raster
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # El script usa `fetch` nativo y `AbortSignal.timeout`: Node 20 basta,
          # y el repo ya declara >=20 en `engines`.
          node-version: 22

      - name: Auditar cada capa contra su servidor
        run: node scripts/check-globe-layers.mjs
