name: pgTAP

# Las aserciones de supabase/tests no las ejecutaba nadie: no existía job.
# `record_game_run.sql` (plan 12) y `games_scores_guard.sql` (plan 19) estaban
# escritas y jamás corridas, así que la liga podía estar rota sin que el CI
# dijera nada.
#
# La secuencia `db start` + `test db` es la que documenta Supabase para GitHub
# Actions: `db start` levanta Postgres, aplica migraciones y seed, y `test db`
# corre pg_prove contra esa base.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pgtap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: supabase pgTAP
    runs-on: ubuntu-latest
    # Techo holgado: un arranque en frío ronda 2-4 min, y esto sólo evita que un
    # pull de imagen atascado bloquee el gate para siempre.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fijado a propósito. Sin `version`, la action resuelve 2.20.3 (lo dijo su
      # log) frente al 3.3.0 de 23-nov-2026. Las migraciones se prueban contra
      # un CLI conocido, no contra el que toque esa semana.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0

      - name: Start local database
        run: |
          # El pull de la imagen de Postgres es lo que hinchaba el log hasta que
          # la descarga por API se truncaba antes de llegar al TAP. Se guarda
          # aparte y sólo se muestra si el arranque falla.
          log="${RUNNER_TEMP}/db-start.log"
          if ! supabase db start > "$log" 2>&1; then
            echo "::group::log de supabase db start"
            tail -n 80 "$log"
            echo "::endgroup::"
            exit 1
          fi

      - name: Run pgTAP suites
        run: |
          # Sólo la parte TAP del log: el resumen por fichero, las líneas
          # `ok`/`not ok`, los diagnósticos `#` y el veredicto. Fuera los avisos
          # de psql (`NOTICE: extension "pgtap" already exists`) y lo que añade
          # el CLI (pull de imágenes, spinners), para que un fallo quepa entero
          # en la descarga del log.
          #
          # El runner corre con `bash -e`: sin el `|| status=$?` la primera
          # orden que falla corta el script antes de imprimir nada.
          log="${RUNNER_TEMP}/pgtap.log"
          status=0
          supabase test db supabase/tests > "$log" 2>&1 || status=$?
          tap="${RUNNER_TEMP}/pgtap.tap"
          grep -E -e '^[[:space:]]*(TAP version|[0-9]+\.\.|ok |not ok |#|Bail out!)' \
                   -e '^[[:space:]]*[^[:space:]]*\.sql' \
                   -e '^(Result|Failed|Tests=|Files=|Dubious|Parse errors)' \
                   "$log" \
            | grep -v 'NOTICE:' > "$tap" || true
          if [ -s "$tap" ]; then
            cat "$tap"
          else
            echo "(sin líneas TAP reconocibles; se muestra el final del log)"
            tail -n 40 "$log"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::pgTAP en rojo: mira arriba las líneas '# Failed test' o 'not ok'."
            exit 1
          fi

      - name: Los plan() declarados cuadran con lo ejecutado
        run: |
          # El paso anterior vuelca lo que pg_prove imprimió, pero no nota lo
          # que falta: pg_prove da el total (`Tests=N`) sin desglose por
          # fichero, así que una suite que no llega a ejecutarse sólo se ve como
          # un total más bajo, y con `Result: PASS` el run sigue verde.
          #
          # Se compara el total con la suma de los `plan(N)` que declaran las
          # suites: si son distintos, alguna no corrió (parse error, fichero no
          # recogido, base a medias) y esto se pone rojo.
          log="${RUNNER_TEMP}/pgtap.log"

          declaradas=0
          suites=0
          for f in supabase/tests/*.sql; do
            [ -e "$f" ] || continue
            suites=$((suites + 1))
            n=$(grep -oE 'plan[[:space:]]*\([[:space:]]*[0-9]+' "$f" | grep -oE '[0-9]+' | head -n1)
            if [ -z "$n" ]; then
              echo "::error file=$f::no declara plan(N): sin número no hay forma de saber si se ejecutó"
              exit 1
            fi
            declaradas=$((declaradas + n))
          done

          if [ "$suites" -eq 0 ]; then
            echo "::error::no hay ninguna suite en supabase/tests"
            exit 1
          fi

          ejecutadas=$(grep -oE 'Tests=[[:space:]]*[0-9]+' "$log" | tail -n1 | grep -oE '[0-9]+' || true)
          if [ -z "$ejecutadas" ]; then
            echo "::error::pg_prove no imprimió un total (Tests=N): no se sabe qué se ejecutó"
            exit 1
          fi

          echo "$suites suites declaran $declaradas aserciones; pg_prove ejecutó $ejecutadas."
          if [ "$declaradas" -ne "$ejecutadas" ]; then
            echo "::error::$declaradas aserciones declaradas frente a $ejecutadas ejecutadas: alguna suite no llegó a correr entera."
            exit 1
          fi
