name: lock sync

# Sincroniza package-lock.json con package.json ejecutando el propio npm
# (`npm install --package-lock-only`) en un runner, para cuando no hay Node a
# mano. Se lanza con un push a la rama porque `workflow_dispatch` exige el
# fichero en la rama por defecto. El commit que genera lleva la marca
# `lock-sync: aplicado` para que el job no se vuelva a disparar.

on:
  push:
    branches: [fix/package-lock]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', 'lock-sync: aplicado') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sólo el lockfile: no toca package.json ni instala node_modules.
      - name: npm install --package-lock-only
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit y push del lock
        shell: bash
        run: |
          set -eu
          if git diff --quiet -- package-lock.json; then
            echo "El lock ya estaba en sincronía con package.json."
            exit 0
          fi
          git config user.name "lock-sync"
          git config user.email "lock-sync@users.noreply.github.com"
          git add package-lock.json
          git commit -m "lock-sync: aplicado — package-lock.json en sincronía con package.json"
          git push origin "HEAD:${{ github.ref_name }}"
