name: escape-probe

# Temporal: no cambia la config de eslint ni el código; solo fuerza que
# `no-useless-escape` salga como error y lo imprime como fichero:línea:columna.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: escapes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Solo no-useless-escape
        shell: bash
        run: |
          npx eslint . --format=json --rule '{"no-useless-escape":"error"}' > eslint.json || true
          node -e '
            const results = require("./eslint.json");
            let total = 0;
            for (const file of results) {
              for (const message of file.messages) {
                if (message.ruleId !== "no-useless-escape") continue;
                total += 1;
                const where = file.filePath.replace(`${process.cwd()}/`, "");
                console.log(`${where}:${message.line}:${message.column} ${message.message}`);
              }
            }
            console.log(`no-useless-escape total=${total}`);
          '
