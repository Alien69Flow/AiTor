name: ip dump
on:
  push:
    branches: ["chore/ip-unificado"]
    paths:
      - ".github/workflows/ip-dump.yml"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ip-unificado
      - name: cabecera
        run: sed -n '1,45p' api/mcp.ts | cat -n
      - name: tipo-req
        run: grep -n 'ApiRequest\|VercelRequest\|req:' api/mcp.ts | head -20
