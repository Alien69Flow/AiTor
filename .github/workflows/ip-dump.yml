name: ip dump
on:
  push:
    branches: ["chore/ip-unificado"]
    paths:
      - ".github/workflows/ip-dump.yml"
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ip-unificado
      - name: mcp
        run: grep -n -B8 -A22 -i 'x-forwarded-for' api/mcp.ts
      - name: usos
        run: grep -rn 'clientIp' api --include=*.ts
      - name: guard-test
        run: cat -n supabase/functions/_shared/guard.test.ts
