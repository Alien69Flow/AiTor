# Monta los motores nuevos del arcade en la pestaña de juegos, arregla las dos
# pruebas del catálogo del globo que tienen `main` en rojo, y compila y prueba
# el árbol resultante antes de confirmarlo.
#
# `main` está protegida y exige `typecheck · lint · build`, y un commit firmado
# con GITHUB_TOKEN no lanza workflows: por eso esto empuja a una rama y entra
# por PR, con el árbol ya compilado aquí.
name: arcade-motores

on:
  push:
    branches: [feat/arcade-motores]
    paths:
      - "scripts/arcade-engines-patch.mjs"
      - ".github/workflows/arcade-engines.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcade-motores
  cancel-in-progress: false

jobs:
  montar:
    name: montar, compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Montar los motores
        run: node scripts/arcade-engines-patch.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas de los motores y del catálogo
        run: npx vitest run src/lib/arcade-racers.test.ts src/lib/mus.test.ts src/lib/globe-layers.test.ts

      - name: Confirmar y empujar
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Sin cambios que confirmar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "arcade: kart, cruce de carriles, combate y mus jugables en la pestaña"
          for intento in 1 2 3 4 5; do
            if git push origin HEAD:feat/arcade-motores; then
              exit 0
            fi
            git fetch origin feat/arcade-motores
            git rebase origin/feat/arcade-motores || exit 1
            sleep $((intento * 3))
          done
          exit 1
