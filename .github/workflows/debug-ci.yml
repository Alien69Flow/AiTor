name: debug-ci

# Temporal: el job `build` de esta rama cae en Unit tests y el log completo se
# trunca antes del fallo. Este workflow corre la suite, conserva el código de
# salida e imprime sólo las líneas de fallo. Se borra cuando esté en verde.
on:
  push:
    branches: [feat/firecrawl-v2]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Suite completa (sólo fallos)
        shell: bash
        run: |
          set -o pipefail
          status=0
          npm test > /tmp/vitest.log 2>&1 || status=$?
          echo "EXIT_STATUS=$status"
          grep -aE "FAIL|×|AssertionError|Error:|Expected|Received|Test Files|Tests " /tmp/vitest.log | tail -n 80
          echo "---- cola del log ----"
          tail -n 30 /tmp/vitest.log
          exit $status
