name: csp raw body patch

# Sonda temporal, se borra en un commit posterior: aplica el parche de lectura
# del cuerpo crudo en api/csp-report.ts, lo compila y lo prueba antes de
# commitear, para no reescribir a ciegas un fichero ya saneado.

on:
  push:
    branches: ["chore/csp-report-only"]
    paths:
      - ".github/workflows/csp-raw-body-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: aplicar y verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/csp-report-only

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      - name: Aplicar parche
        run: |
          node <<'JS'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "api/csp-report.ts";
          const src = readFileSync(path, "utf8");

          if (src.includes("readRawBody")) {
            console.log("ya parcheado: nada que hacer");
            process.exit(0);
          }

          const line = /^([ \t]*)const reports = parseReports\(payload\)[^;\n]*;[ \t]*$/m;
          const match = line.exec(src);
          if (!match) {
            console.error("no encuentro 'const reports = parseReports(payload)'; fichero actual:");
            console.error(src);
            process.exit(1);
          }

          const ind = match[1];
          const block = [
            ind + "let reports = parseReports(payload);",
            "",
            ind + "// Vercel no parsea `application/csp-report` ni `application/reports+json`:",
            ind + "// deja `req.body` vacio y el JSON sin leer en el stream de la peticion, asi",
            ind + "// que el colector se quedaria mudo justo en produccion. Se lee el crudo solo",
            ind + "// cuando lo que ya llego no produce ni un informe (vacio, `{}` o un",
            ind + "// envoltorio ajeno).",
            ind + "if (reports.length === 0) {",
            ind + "  try {",
            ind + "    reports = parseReports(decodeBody(await readRawBody(req)));",
            ind + "  } catch {",
            ind + "    reports = [];",
            ind + "  }",
            ind + "}",
            "",
            ind + "reports = reports.slice(0, MAX_REPORTS_PER_REQUEST);",
          ].join("\n");

          const helpers = [
            "",
            "/**",
            " * Cuerpo crudo de la peticion, que es donde Vercel deja los tipos que no",
            " * sabe parsear. Devuelve vacio si el stream ya estaba consumido (el cuerpo",
            " * llego parseado) o si pasa del tope: en los dos casos no hay informe que",
            " * rescatar.",
            " */",
            "async function readRawBody(req: unknown): Promise<string> {",
            "  const source = req as Record<symbol, unknown>;",
            "  if (typeof source[Symbol.asyncIterator] !== 'function') return '';",
            "",
            "  const encoder = new TextEncoder();",
            "  const chunks: Uint8Array[] = [];",
            "  let size = 0;",
            "",
            "  for await (const chunk of req as AsyncIterable<Uint8Array | string>) {",
            "    const bytes = typeof chunk === 'string' ? encoder.encode(chunk) : chunk;",
            "    size += bytes.length;",
            "    if (size > MAX_BODY_BYTES) return '';",
            "    chunks.push(bytes);",
            "  }",
            "",
            "  const raw = new Uint8Array(size);",
            "  let offset = 0;",
            "  for (const chunk of chunks) {",
            "    raw.set(chunk, offset);",
            "    offset += chunk.length;",
            "  }",
            "  return new TextDecoder().decode(raw);",
            "}",
            "",
          ].join("\n");

          writeFileSync(path, src.replace(line, () => block) + helpers);
          console.log("parcheado api/csp-report.ts");
          JS

      - name: Typecheck de la API
        run: npx tsc -p tsconfig.api.json --noEmit

      - name: Pruebas del colector
        run: npx vitest run api/csp-report

      - name: Commit del parche
        run: |
          if git diff --quiet; then
            echo "sin cambios que commitear"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/csp-report.ts
          git commit -m "fix(seguridad): leer el cuerpo crudo del informe cuando Vercel no lo parsea"
          git push origin HEAD:chore/csp-report-only
