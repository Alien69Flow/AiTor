name: csp raw body patch

# Sonda temporal, se borra en un commit posterior. Primero vuelca el handler
# para ver el ancla exacta; con ese texto se aplica el parche y se verifica.

on:
  push:
    branches: ["chore/csp-report-only"]
    paths:
      - ".github/workflows/csp-raw-body-patch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    name: volcar handler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/csp-report-only

      - name: Volcar api/csp-report.ts
        run: |
          wc -c api/csp-report.ts
          echo '-----INICIO-----'
          cat -A api/csp-report.ts | sed -e 's/\$$//' | head -n 400
          echo '-----FIN-----'
