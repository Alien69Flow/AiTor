name: csp raw body patch

# Sonda temporal, se borra en un commit posterior: aplica el parche de lectura
# del cuerpo crudo, compila y pasa las pruebas antes de commitear.

on:
  push:
    branches: ["chore/csp-report-only"]
    paths:
      - ".github/workflows/csp-raw-body-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    name: aplicar y verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/csp-report-only

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Dependencias
        run: npm ci --no-audit --no-fund >/dev/null 2>&1

      - name: Aplicar parche
        run: |
          node <<'JS'
          const { readFileSync, writeFileSync } = require("node:fs");
          const path = "api/csp-report.ts";
          const src = readFileSync(path, "utf8");

          if (src.includes("readRawBody")) {
            console.log("ya parcheado: nada que hacer");
            process.exit(0);
          }

          const anchor = "  for (const report of parseReports(decodeBody(req.body))) {";
          if (!src.includes(anchor)) {
            console.error("falta el ancla del bucle de informes");
            process.exit(1);
          }

          const patched = [
            "  let reports = parseReports(decodeBody(req.body));",
            "",
            "  // Vercel no parsea `application/csp-report` ni `application/reports+json`:",
            "  // deja `req.body` vacio y el JSON sin leer en el stream de la peticion, asi",
            "  // que el colector se quedaria mudo justo en produccion. Se lee el crudo solo",
            "  // cuando lo que ya llego no produce ni un informe (vacio, `{}` o un",
            "  // envoltorio ajeno).",
            "  if (reports.length === 0) {",
            "    reports = parseReports(decodeBody(await readRawBody(req)));",
            "  }",
            "",
            "  for (const report of reports) {",
          ].join("\n");

          const helper = [
            "",
            "/**",
            " * Cuerpo crudo de la peticion, que es donde Vercel deja los tipos que no",
            " * sabe parsear. Devuelve vacio si el stream ya estaba consumido (el cuerpo",
            " * llego parseado) o si pasa del tope: en los dos casos no hay informe que",
            " * rescatar.",
            " */",
            "async function readRawBody(req: unknown): Promise<string> {",
            "  const source = req as unknown as Record<symbol, unknown>;",
            "  if (typeof source[Symbol.asyncIterator] !== 'function') return '';",
            "",
            "  const encoder = new TextEncoder();",
            "  const chunks: Uint8Array[] = [];",
            "  let size = 0;",
            "",
            "  for await (const chunk of req as unknown as AsyncIterable<Uint8Array | string>) {",
            "    const bytes = typeof chunk === 'string' ? encoder.encode(chunk) : chunk;",
            "    size += bytes.length;",
            "    if (size > MAX_BODY_BYTES) return '';",
            "    chunks.push(bytes);",
            "  }",
            "",
            "  const raw = new Uint8Array(size);",
            "  let offset = 0;",
            "  for (const chunk of chunks) {",
            "    raw.set(chunk, offset);",
            "    offset += chunk.length;",
            "  }",
            "  return new TextDecoder().decode(raw);",
            "}",
            "",
          ].join("\n");

          writeFileSync(path, src.replace(anchor, () => patched) + helper);
          console.log("parcheado api/csp-report.ts");
          JS

      - name: Typecheck de la API
        run: npx tsc -p tsconfig.api.json --noEmit && echo TSC_OK

      - name: Pruebas del colector
        run: |
          node -v
          npx vitest run api/csp-report.test.ts api/csp-report.raw-body.test.ts 2>&1 | tail -40

      - name: Commit del parche
        run: |
          if git diff --quiet; then
            echo "sin cambios que commitear"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/csp-report.ts
          git commit -m "fix(seguridad): leer el cuerpo crudo del informe cuando Vercel no lo parsea"
          git push origin HEAD:chore/csp-report-only
