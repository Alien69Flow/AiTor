name: probe

# Temporal: corre la suite con el reporter de GitHub Actions para que los
# fallos salgan como anotaciones (fichero y línea) en vez de como log largo.
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    name: probe tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests con anotaciones
        run: npx vitest run --reporter=github-actions
