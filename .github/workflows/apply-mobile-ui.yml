# Ajustes de lectura para móvil: burbujas del chat y pestañas de la barra superior.
#
# El parche vive en `src/lib/mobile-ui-patch.ts` con sus pruebas y aquí se aplica
# sobre los ficheros reales. Si un ancla cambió o se repitió, el script sale con
# 1 y no escribe nada.
#
# El job verifica antes de confirmar (typecheck del proyecto y las pruebas del
# parche) porque el commit que empuja el bot se hace con GITHUB_TOKEN y GitHub no
# lanza workflows con ese token: sin estos pasos nadie compilaría el head.
name: UI móvil · chat y pestañas

on:
  workflow_dispatch:
  push:
    branches: [feat/ui-movil]
    paths:
      - "src/components/chat/ChatMessage.tsx"
      - "src/components/dashboard/TopNavBar.tsx"
      - "src/lib/mobile-ui-patch.ts"
      - "scripts/apply-mobile-ui-patch.ts"
      - ".github/workflows/apply-mobile-ui.yml"
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: ui-movil
  cancel-in-progress: false

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/ui-movil'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar los ajustes de móvil
        run: npx tsx scripts/apply-mobile-ui-patch.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas del parche
        run: npx vitest run src/lib/mobile-ui-patch.test.ts

      - name: Confirmar si hubo cambios
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios: el chat y las pestañas ya tienen los ajustes."
            exit 0
          fi
          git add -A
          git commit -m "fix(ui): chat y pestañas legibles en pantallas pequeñas"
          for intento in 1 2 3 4 5; do
            if git push origin "HEAD:${RAMA}"; then
              echo "Parche confirmado en el intento ${intento}."
              exit 0
            fi
            echo "Push rechazado (intento ${intento}): rebaso y reintento."
            if ! git pull --rebase --autostash origin "${RAMA}"; then
              git rebase --abort || true
              echo "El rebase no se pudo aplicar: revisa el conflicto a mano." >&2
              exit 1
            fi
          done
          echo "No se pudo confirmar el parche tras cinco intentos." >&2
          exit 1
