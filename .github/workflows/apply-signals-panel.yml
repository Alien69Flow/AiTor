# Monta el panel de señales del motor en la pestaña de Markets.
#
# Mismo patrón que el cableado del globo: el parche vive en
# `src/lib/signals-panel-patch.ts` con sus pruebas, y aquí se aplica sobre
# `SignalsTab.tsx`, que es el fichero real. Si el componente cambió y las anclas
# no están, el script falla con código 1 y no escribe nada.
#
# La confirmación rebasa con reintentos: puede entrar un commit del autor
# mientras corre el job, y entonces el push directo se rechaza.
#
# Ojo: el commit que empuja el bot se hace con GITHUB_TOKEN y no dispara
# workflows, así que ese head necesita un empujón desde una cuenta para tener
# CI.

name: Panel de señales

on:
  workflow_dispatch:
  push:
    branches: [feat/senales-mercados]
    paths:
      - "src/components/dashboard/SignalsTab.tsx"
      - "src/components/dashboard/MarketSignalsPanel.tsx"
      - "src/lib/signals-panel-patch.ts"
      - "src/lib/market-signal-board.ts"
      - "scripts/apply-signals-panel.ts"
      - ".github/workflows/apply-signals-panel.yml"

permissions:
  contents: write

concurrency:
  group: panel-senales
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: el rebase necesita la base remota.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts` para no lanzar prebuild/predev, que aquí no hacen falta.
      - name: Dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar el panel
        run: npx tsx scripts/apply-signals-panel.ts

      - name: Confirmar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios: el panel ya estaba montado."
            exit 0
          fi
          git add -A
          git commit -m "Mercados: panel de señales del motor en la pestaña"
          for intento in 1 2 3 4 5; do
            if git push origin HEAD:feat/senales-mercados; then
              echo "Panel confirmado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado (intento $intento): rebaso sobre origin y reintento."
            if ! git pull --rebase --autostash origin feat/senales-mercados; then
              git rebase --abort || true
              echo "El rebase no se pudo aplicar: revisa el conflicto a mano." >&2
              exit 1
            fi
          done
          echo "No se pudo confirmar el panel tras cinco intentos." >&2
          exit 1
