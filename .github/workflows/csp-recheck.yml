name: csp-recheck

# Sonda temporal: tipos y pruebas del colector CSP. Se borra en el commit siguiente.

on:
  push:
    paths:
      - ".github/workflows/csp-recheck.yml"
      - "api/csp-report.ts"
      - "api/csp-report.test.ts"

permissions:
  contents: read

jobs:
  probe:
    name: csp-recheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck de la API
        run: npx tsc -p tsconfig.api.json --noEmit

      - name: Pruebas del colector
        run: |
          set +e
          npx vitest run api/csp-report.test.ts > probe.log 2>&1
          status=$?
          grep -E "✓|×|Test Files|Tests  |FAIL|AssertionError" probe.log | tail -n 40
          exit $status
