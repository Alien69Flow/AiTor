name: deploy

# Despliegue manual de la superficie que no sale con un push a `main`:
# las Edge Functions de Supabase (Lovable Cloud) y la clave del modelo en Vercel.
#
# `/api/mcp` y `/api/telegram-webhook` se despliegan solos al fusionar en `main`
# (Vercel está conectado al repo); esto cubre lo que necesita credenciales.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  obligatorio para las Edge Functions
#   SUPABASE_PROJECT_REF   opcional, por defecto wkdtvrxavkhbifjtvvdw
#   GEMINI_API_KEY         obligatorio si se sube la clave (empieza por AIza)
#   VERCEL_TOKEN           obligatorio si se sube la clave a Vercel
#
# Sin los secretos el workflow falla en el primer paso con el nombre exacto que
# falta, en vez de desplegar a medias.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Funciones de Supabase a desplegar (coma)"
        default: "chat,github-proxy"
        required: true
        type: string
      set_gemini_key:
        description: "Subir GEMINI_API_KEY a Vercel (Production)"
        default: true
        type: boolean
      health:
        description: "Comprobar la salud al terminar"
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-manual
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'wkdtvrxavkhbifjtvvdw' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preflight de secretos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          falta=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens)."
            falta=1
          fi
          if [ "${{ inputs.set_gemini_key }}" = "true" ]; then
            if [ -z "$GEMINI_API_KEY" ]; then
              echo "::error::Falta el secreto GEMINI_API_KEY (Google AI Studio, empieza por AIza)."
              falta=1
            fi
            if [ -z "$VERCEL_TOKEN" ]; then
              echo "::error::Falta el secreto VERCEL_TOKEN (Vercel → Account Settings → Tokens)."
              falta=1
            fi
          fi
          exit $falta

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Desplegar Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          IFS=',' read -ra FUNCIONES <<< "${{ inputs.functions }}"
          for fn in "${FUNCIONES[@]}"; do
            fn_trim="$(echo "$fn" | xargs)"
            [ -z "$fn_trim" ] && continue
            echo "→ desplegando $fn_trim"
            npx supabase functions deploy "$fn_trim" --project-ref "$SUPABASE_PROJECT_REF"
          done

      # La clave va a Vercel, no a Supabase: el bucle de herramientas vive en
      # /api/mcp. El script valida la clave contra la API de Gemini antes de
      # escribirla y nunca la imprime.
      - name: Subir GEMINI_API_KEY a Vercel
        if: ${{ inputs.set_gemini_key }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/vercel-gemini-key.mjs --set

      - name: Comprobar salud
        if: ${{ inputs.health }}
        run: node scripts/deploy-all.mjs --verify

      - name: Resumen
        if: always()
        run: |
          {
            echo "## Despliegue manual"
            echo ""
            echo "- Funciones pedidas: `${{ inputs.functions }}`"
            echo "- Clave de Gemini a Vercel: `${{ inputs.set_gemini_key }}`"
            echo ""
            echo "Si `/api/mcp` sigue con `geminiKeyState: missing` tras subir la clave,"
            echo "falta un redeploy: Vercel lee las variables al construir, así que el"
            echo "siguiente push a `main` (o un Redeploy en el panel) la aplica."
          } >> "$GITHUB_STEP_SUMMARY"
