# Aplica el cambio del hielo marino a AMSR2 25 km, pone al día las dos pruebas
# del catálogo que quedaron congeladas en el comportamiento anterior a #63/#64
# y añade la sonda polar a la auditoría de capas.
#
# Es la misma receta que en `feat/globo-amsr2`, pero partiendo del `main` de
# ahora: aquella rama quedó en conflicto con lo que entró en main mientras
# tanto, y reaplicar el parche sobre el árbol actual es más limpio que pelear
# el conflicto a ciegas.
#
# `main` está protegida y exige `typecheck · lint · build`, y un commit firmado
# con GITHUB_TOKEN no lanza workflows: por eso esto empuja a una rama y entra
# por PR, con el árbol ya compilado y probado aquí.
name: globo-amsr2b

on:
  push:
    branches: [feat/globo-amsr2b]
    paths:
      - "scripts/globe-amsr2-patch.mjs"
      - ".github/workflows/globo-amsr2b.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: globo-amsr2b
  cancel-in-progress: false

jobs:
  aplicar:
    name: aplicar, compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Aplicar el parche
        run: node scripts/globe-amsr2-patch.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Pruebas del catálogo
        run: npx vitest run src/lib/globe-layers.test.ts

      - name: Confirmar y empujar
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Sin cambios que confirmar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "globo: hielo marino AMSR2 25 km, pruebas al día y sonda polar"
          for intento in 1 2 3 4 5; do
            if git push origin HEAD:feat/globo-amsr2b; then
              exit 0
            fi
            git fetch origin feat/globo-amsr2b
            git rebase origin/feat/globo-amsr2b || exit 1
            sleep $((intento * 3))
          done
          exit 1
