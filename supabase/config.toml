# Ref canónico del proyecto de DATOS Y FUNCIONES (wiKDT).
#
# Este repositorio trabaja con dos proyectos de Supabase y no son
# intercambiables: aquí viven las Edge Functions y las tablas del producto
# (`wkdtvrxavkhbifjtvvdw`); el proyecto de identidad, el que tiene Google
# configurado (`pnyigikagdxqaogbiift`), lo usan `src/integrations/supabase/client.ts`
# y las `AUTH_SUPABASE_URL` de `api/mcp.ts` y `api/league.ts`.
#
# Estuvo en `pnyi…` y por eso `npm run edge:deploy` desplegaba donde nada
# responde: `GET /functions/v1/chat` da 200 en `wkdt…` y 404 en `pnyi…`.
# `scripts/supabase-ref.test.mjs` impide que vuelva a divergir.
project_id = "wkdtvrxavkhbifjtvvdw"

[functions.chat]
verify_jwt = false

# Memoria del hilo: el webhook de Telegram la llama con la JWT anon del
# despliegue y ella escribe con la service key.
[functions.chat-thread]
verify_jwt = false

[functions.ufo-feed]
verify_jwt = false

[functions.crypto-feed]
verify_jwt = false

[functions.github-proxy]
verify_jwt = false

[functions.firecrawl-search]
verify_jwt = false

[functions.crypto-signals]
verify_jwt = false

[functions.crypto-price]
verify_jwt = false

[functions.osint-aggregator]
verify_jwt = false

[functions.cesium-tiles]
verify_jwt = false

[functions.openweather]
verify_jwt = false

[functions.air-traffic]
verify_jwt = false

[functions.marine-traffic]
verify_jwt = false

[functions.weather-grid]
verify_jwt = false

[functions.noaa-space-weather]
verify_jwt = false

# Every deployed function must be listed here with an explicit value. A
# function that is missing falls back to verify_jwt = true on the next
# `supabase functions deploy`, which would silently break the ones whose own
# code already does the checking:
#   · wallet-auth, verify-crypto-payment, verify-dao-holdings — validate the
#     caller's Bearer token themselves (admin.auth.getUser), so the gateway
#     must let the request through first.
#   · web3-recipient, globe-feeds, firecrawl-osint — public proxies guarded by
#     the shared origin allowlist + rate limit, no session involved.
[functions.wallet-auth]
verify_jwt = false

[functions.verify-crypto-payment]
verify_jwt = false

[functions.verify-dao-holdings]
verify_jwt = false

[functions.web3-recipient]
verify_jwt = false

[functions.globe-feeds]
verify_jwt = false

[functions.firecrawl-osint]
verify_jwt = false
